<!DOCTYPE html>
<html>
<head>
    <title>Stretching the Sheet</title>
    <style>
        body { 
            background: #111; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: monospace; 
            overflow: hidden;
        }
        .container { 
            position: relative; 
            width: 500px; 
            height: 500px; 
            border: 2px solid #444; 
            margin-bottom: 30px; 
            overflow: hidden;
            background: #1a1a1a;
        }
        
        #universe {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            transform-origin: 50% 50%;
            transition: transform 0.1s;
        }

        .grid { 
            position: absolute; 
            top: -100%; 
            left: -100%; 
            width: 300%; 
            height: 300%;
            background-image: 
                linear-gradient(#333 2px, transparent 2px),
                linear-gradient(90deg, #333 2px, transparent 2px);
            background-size: 50px 50px;
            background-position: center center;
        }
        
        .axis-x { 
            position: absolute; 
            top: 50%; left: -100%; width: 300%; height: 4px; 
            background: #ff3366; margin-top: -2px;
        }
        
        .axis-y { 
            position: absolute; 
            top: -100%; left: 50%; width: 4px; height: 300%; 
            background: #00ffcc; margin-left: -2px;
        }
        
        .shape {
            position: absolute; 
            bottom: 50%; 
            left: 50%; 
            width: 100px; 
            height: 100px; 
            background: rgba(0, 255, 204, 0.4); 
            border: 4px solid #00ffcc;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 40px;
        }

        .slider-container { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 10px; 
            font-size: 18px; 
        }
        
        input[type=range] { 
            width: 200px; 
            cursor: pointer; 
            accent-color: #00ffcc;
        }
        .readout { color: #888; }
    </style>
</head>
<body>
    
    <div class="container">
        <div id="universe">
            <div class="grid"></div>
            <div class="axis-x"></div>
            <div class="axis-y"></div>
            <div class="shape"></div>
        </div>
    </div>
    
    <div class="controls">
        <div class="slider-container">
            <label>Stretch / Squish Sideways</label>
            <input type="range" id="scaleX" min="-3" max="3" step="0.1" value="1" oninput="updateSpace()">
            <div class="readout">Width: <span id="valX" style="color: #ff3366; font-weight: bold;">1.0</span>x</div>
        </div>
        <div class="slider-container">
            <label>Stretch / Squish Up-Down</label>
            <input type="range" id="scaleY" min="-3" max="3" step="0.1" value="1" oninput="updateSpace()">
            <div class="readout">Height: <span id="valY" style="color: #00ffcc; font-weight: bold;">1.0</span>x</div>
        </div>
    </div>

    <script>
        function updateSpace() {
            let sx = document.getElementById('scaleX').value;
            let sy = document.getElementById('scaleY').value;
            
            document.getElementById('valX').innerText = parseFloat(sx).toFixed(1);
            document.getElementById('valY').innerText = parseFloat(sy).toFixed(1);
            
            document.getElementById('universe').style.transform = `scale(${sx}, ${sy})`;
        }
    </script>
</body>
</html>
