<!DOCTYPE html>
<html>
<head>
    <title>Stuck on the Line</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        svg { overflow: visible; }
        .axis { stroke: #444; stroke-width: 4; }
        .tick { stroke: #444; stroke-width: 3; }
        .label { fill: #888; font-size: 20px; text-anchor: middle; font-family: monospace; }
        
        #train { 
            transition: transform 0.8s ease-in-out; 
            transform-origin: 0 0; 
        }
        
        .button { background: #222; border: 1px solid #555; color: #fff; padding: 16px 32px; font-size: 20px; border-radius: 8px; cursor: pointer; margin-top: 60px; transition: 0.2s; font-family: monospace;}
        .button:hover { background: #333; border-color: #ff3366; color: #ff3366; }
        
        .equation { font-size: 22px; font-family: monospace; margin-top: 30px; color: #aaa; text-align: center; max-width: 600px; line-height: 1.5;}
        .highlight { color: #ff3366; font-weight: bold; }
    </style>
</head>
<body>
    <svg width="600" height="150" viewBox="-300 -75 600 150">
        <!-- The ONLY Dimension (A strict track) -->
        <line class="axis" x1="-300" y1="0" x2="300" y2="0" />
        
        <script>
            for(let i=-5; i<=5; i++) {
                document.write(`<line class="tick" x1="${i*50}" y1="-10" x2="${i*50}" y2="10" />`);
                if(i !== 0) document.write(`<text class="label" x="${i*50}" y="35">${i}</text>`);
            }
        </script>
        <text class="label" x="0" y="35">0</text>
        
        <!-- The Train (starts at 1) -->
        <g id="train">
            <!-- Train box -->
            <rect x="0" y="-15" width="50" height="30" fill="#ff3366" rx="4" />
            <text x="25" y="5" fill="#fff" font-size="16" font-family="monospace" text-anchor="middle" dominant-baseline="middle">1</text>
        </g>
    </svg>

    <div class="equation" id="eq">If we are stuck on a strict 1D track, what is a "half-flip"?<br><br>Is it going to <span class="highlight">0</span>?<br>Is it shrinking?<br>Does the train derail?</div>
    <button class="button" onclick="tryHalfFlip()">Try to do a "Half-Flip"</button>

    <script>
        function tryHalfFlip() {
            let train = document.getElementById('train');
            
            // Try to derail the train by rotating it off the track
            train.style.transform = `rotate(-45deg)`;
            
            document.getElementById('eq').innerHTML = `CRASH! The train derailed.<br>You are completely right. You <b>cannot</b> do a half-flip without leaving the line.`;
        }
    </script>
</body>
</html>
