<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the bowl · why the nudge works</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111826; --line:#1e2735;
    --ink:#e6edf3; --dim:#6e7a8a;
    --cyan:#58d6ff; --green:#39d98a; --red:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -10%, #12202e 0%, var(--bg) 60%);
    color:var(--ink); font-family:ui-monospace,'Cascadia Code',Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; padding:18px 12px 44px;
  }
  header{font-size:11px; letter-spacing:3px; color:var(--dim); margin-bottom:14px;}
  .stage{width:min(920px,97vw); display:flex; flex-direction:column; gap:14px;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px;}
  .grow{flex:1 1 380px;}
  svg{width:100%; height:auto; display:block;}
  svg text{font-family:inherit;}
  canvas{width:100%; height:auto; display:block; background:#0d1420; border-radius:10px; touch-action:none;}
  .readout{display:flex; justify-content:center; gap:30px; margin-top:10px; flex-wrap:wrap;}
  .readout div{text-align:center;}
  .readout span{font-size:10px; letter-spacing:2px; color:var(--dim);}
  .readout b{font-size:24px; display:block; margin-top:2px;}
  .controls{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  button{
    font:inherit; font-size:13px; letter-spacing:2px; color:var(--ink);
    background:#0d1420; border:1px solid var(--line); border-radius:9px;
    padding:10px 18px; cursor:pointer; transition:border-color .15s, box-shadow .15s;
  }
  button:hover{border-color:var(--cyan); box-shadow:0 0 12px rgba(88,214,255,.25);}
  button.active{border-color:var(--green); color:var(--green); box-shadow:0 0 12px rgba(57,217,138,.3);}
  .sliderwrap{display:flex; align-items:center; gap:10px; flex:1 1 220px;}
  .sliderwrap span{font-size:11px; letter-spacing:2px; color:var(--dim); white-space:nowrap;}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent; cursor:pointer;}
  input[type=range]::-webkit-slider-runnable-track{height:7px; border-radius:99px; background:#17324a; border:1px solid var(--line);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; margin-top:-10px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #9ff0ff, var(--cyan) 55%, #1d7fa8); border:2px solid #0b0f14; box-shadow:0 0 10px rgba(88,214,255,.5);}
  input[type=range]::-moz-range-track{height:7px;border-radius:99px;background:#17324a;border:1px solid var(--line);}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--cyan);border:2px solid #0b0f14;}
  .dialhit{cursor:grab;}
  .dialhit:active{cursor:grabbing;}
</style>
</head>
<body>
<header>THE BOWL · WHY THE NUDGE WORKS</header>
<div class="stage">
  <div class="row">
    <div class="card grow">
      <svg id="machine" viewBox="0 0 420 220"></svg>
      <div class="readout">
        <div><span>OUT</span><b id="outV" style="color:var(--cyan)">—</b></div>
        <div><span>TRUTH</span><b>10</b></div>
        <div><span>GAP</span><b id="gapV">—</b></div>
      </div>
    </div>
    <div class="card grow"><canvas id="bowl" width="460" height="360"></canvas></div>
  </div>
  <div class="card controls">
    <button id="nudge">NUDGE</button>
    <button id="auto">AUTO</button>
    <button id="reset">RESET</button>
    <div class="sliderwrap">
      <span>STEP <b id="stepV" style="color:var(--cyan)">0.10</b></span>
      <input id="step" type="range" min="0.05" max="1.2" step="0.01" value="0.1">
    </div>
  </div>
</div>

<script>
const IN = 2, TRUTH = 10;
const NS = 'http://www.w3.org/2000/svg';
let w = 9;                 // dial position
let gap = TRUTH - IN*w;    // signed gap
let trail = [];
let autoTimer = null;
let animating = false;

/* ---------- machine svg ---------- */
const svg = document.getElementById('machine');
function el(t, a){ const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; }

const defs = el('defs',{});
defs.innerHTML = '<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4a5f"/></marker>';
svg.appendChild(defs);

// input box
svg.appendChild(el('rect',{x:18,y:80,width:66,height:56,rx:11,fill:'#13202e',stroke:'#2a3a4d'}));
svg.appendChild(el('text',{x:51,y:104,'text-anchor':'middle','font-size':10,fill:'#6e7a8a','letter-spacing':2})).textContent='IN';
svg.appendChild(el('text',{x:51,y:126,'text-anchor':'middle','font-size':22,fill:'#e6edf3'})).textContent='2';
// arrow in->dial
svg.appendChild(el('line',{x1:88,y1:108,x2:114,y2:108,stroke:'#3a4a5f','stroke-width':2,'marker-end':'url(#arr)'}));

const CX=180, CY=108, R=56;
const dialRing = el('circle',{cx:CX,cy:CY,r:R,fill:'rgba(57,217,138,.06)',stroke:'#39d98a','stroke-width':2,'stroke-opacity':.45});
svg.appendChild(dialRing);
for(let k=0;k<=10;k++){
  const a=(135+k*27)*Math.PI/180;
  svg.appendChild(el('line',{
    x1:CX+(R+4)*Math.cos(a), y1:CY+(R+4)*Math.sin(a),
    x2:CX+(R+11)*Math.cos(a), y2:CY+(R+11)*Math.sin(a),
    stroke:'#2a3a4d','stroke-width':2}));
}
const needle = el('line',{x1:CX,y1:CY,x2:CX,y2:CY-R+14,stroke:'#58d6ff','stroke-width':4,'stroke-linecap':'round'});
svg.appendChild(needle);
svg.appendChild(el('circle',{cx:CX,cy:CY,r:7,fill:'#58d6ff'}));
const wText = el('text',{x:CX,y:CY+34,'text-anchor':'middle','font-size':17,fill:'#e6edf3'});
svg.appendChild(wText);
const wLabel = el('text',{x:CX,y:CY+R+30,'text-anchor':'middle','font-size':10,fill:'#6e7a8a','letter-spacing':2});
wLabel.textContent='DIAL (w)';
svg.appendChild(wLabel);
const dialHit = el('circle',{cx:CX,cy:CY,r:R+16,fill:'transparent','class':'dialhit'});
svg.appendChild(dialHit);

// arrow dial->out
svg.appendChild(el('line',{x1:246,y1:108,x2:272,y2:108,stroke:'#3a4a5f','stroke-width':2,'marker-end':'url(#arr)'}));
// output box
svg.appendChild(el('rect',{x:276,y:80,width:66,height:56,rx:11,fill:'#241419',stroke:'#4d2a33'}));
svg.appendChild(el('text',{x:309,y:104,'text-anchor':'middle','font-size':10,fill:'#6e7a8a','letter-spacing':2})).textContent='OUT';
const outText = el('text',{x:309,y:126,'text-anchor':'middle','font-size':22,fill:'#58d6ff'});
svg.appendChild(outText);
// truth box
svg.appendChild(el('rect',{x:276,y:152,width:66,height:44,rx:11,fill:'#241f10',stroke:'#4d432a'}));
svg.appendChild(el('text',{x:309,y:170,'text-anchor':'middle','font-size':10,fill:'#6e7a8a','letter-spacing':2})).textContent='TRUTH';
svg.appendChild(el('text',{x:309,y:189,'text-anchor':'middle','font-size':16,fill:'#e6edf3'})).textContent='10';

/* ---------- bowl canvas ---------- */
const cv = document.getElementById('bowl');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const L=36, RR=16, T=16, B=30;
const px = v => L + (v/10)*(W-L-RR);
const py = g2 => T + (1 - g2/100)*(H-T-B);

function drawBowl(){
  ctx.clearRect(0,0,W,H);
  // axes
  ctx.strokeStyle='#1e2735'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(L,T); ctx.lineTo(L,H-B); ctx.lineTo(W-RR,H-B); ctx.stroke();
  ctx.fillStyle='#4a5568'; ctx.font='10px monospace';
  ctx.fillText('0', L-4, H-B+16); ctx.fillText('5', px(5)-3, H-B+16); ctx.fillText('10', px(10)-8, H-B+16);
  ctx.fillText('w', W-RR-4, H-B+18);
  ctx.fillText('gap²', L-6, T+2);
  ctx.fillText('0', L-12, H-B+4); ctx.fillText('100', L-28, T+8);
  // parabola terrain
  ctx.strokeStyle='#2b6a8f'; ctx.lineWidth=2; ctx.beginPath();
  for(let x=0;x<=10.001;x+=0.05){
    const g = TRUTH - IN*x, y = g*g;
    const X=px(x), Y=py(y);
    x===0 ? ctx.moveTo(X,Y) : ctx.lineTo(X,Y);
  }
  ctx.stroke();
  // trail
  for(const p of trail){
    ctx.fillStyle='rgba(88,214,255,.28)';
    ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 2.2, 0, 7); ctx.fill();
  }
  // ball
  const g2 = gap*gap;
  const rested = Math.abs(gap) < 0.01;
  ctx.save();
  ctx.shadowColor = rested ? '#39d98a' : '#58d6ff';
  ctx.shadowBlur = 16;
  ctx.fillStyle = rested ? '#39d98a' : '#58d6ff';
  ctx.beginPath(); ctx.arc(px(w), py(g2), 7, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- render ---------- */
function render(){
  gap = TRUTH - IN*w;
  const a = (135 + (w/10)*270)*Math.PI/180;
  needle.setAttribute('x2', CX + (R-14)*Math.cos(a));
  needle.setAttribute('y2', CY + (R-14)*Math.sin(a));
  wText.textContent = 'w = ' + w.toFixed(2);
  outText.textContent = (IN*w).toFixed(1);
  document.getElementById('outV').textContent = (IN*w).toFixed(1);
  const gEl = document.getElementById('gapV');
  gEl.textContent = (gap>0?'+':'') + gap.toFixed(1);
  const h = 150*(1 - Math.min(Math.abs(gap)/8, 1));
  gEl.style.color = `hsl(${h},85%,62%)`;
  dialRing.setAttribute('stroke-opacity', Math.abs(gap)<0.01 ? 1 : .45);
  drawBowl();
}

/* ---------- the algorithm YOU derived ---------- */
function nudge(){
  if (animating) return;
  const k = parseFloat(document.getElementById('step').value);
  const target = Math.min(10, Math.max(0, w + k*gap));
  animateTo(target);
}
function animateTo(target){
  animating = true;
  const from = w, t0 = performance.now(), dur = 240;
  (function step(t){
    const p = Math.min((t - t0)/dur, 1);
    const e = 1 - Math.pow(1-p, 3);
    w = from + (target-from)*e;
    trail.push({x:w, y:gap*gap});
    if (trail.length > 400) trail.shift();
    render();
    if (p < 1) requestAnimationFrame(step);
    else { animating = false; if (autoTimer) scheduleAuto(); }
  })(t0);
}
function scheduleAuto(){
  autoTimer = setTimeout(()=>{
    if (Math.abs(gap) < 0.01){ stopAuto(); return; }
    nudge();
  }, 300);
}
function stopAuto(){
  clearTimeout(autoTimer); autoTimer = null;
  document.getElementById('auto').classList.remove('active');
}

document.getElementById('nudge').onclick = ()=>{ stopAuto(); nudge(); };
document.getElementById('auto').onclick = ()=>{
  if (autoTimer){ stopAuto(); return; }
  document.getElementById('auto').classList.add('active');
  autoTimer = true; nudge();
};
document.getElementById('reset').onclick = ()=>{
  stopAuto(); w = 9; trail = []; render();
};
document.getElementById('step').oninput = e=>{
  document.getElementById('stepV').textContent = parseFloat(e.target.value).toFixed(2);
};

/* ---------- drag the ball / the dial ---------- */
function svgPoint(e){
  const r = svg.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(420/r.width), y:(e.clientY-r.top)*(220/r.height) };
}
let dialDrag = false;
dialHit.addEventListener('pointerdown', e=>{ dialDrag=true; dialHit.setPointerCapture(e.pointerId); stopAuto(); });
dialHit.addEventListener('pointermove', e=>{
  if(!dialDrag) return;
  const p = svgPoint(e);
  let deg = Math.atan2(p.y-CY, p.x-CX)*180/Math.PI;
  if (deg < 0) deg += 360;
  if (deg < 135) deg = deg < 90 ? 405 : 135;
  w = Math.min(10, Math.max(0, (deg-135)/270*10));
  trail.push({x:w, y:gap*gap}); render();
});
dialHit.addEventListener('pointerup', ()=> dialDrag=false);

let ballDrag = false;
function canvasW(e){
  const r = cv.getBoundingClientRect();
  return ((e.clientX - r.left)*(W/r.width) - L)/(W-L-RR)*10;
}
cv.addEventListener('pointerdown', e=>{ ballDrag=true; cv.setPointerCapture(e.pointerId); stopAuto();
  w = Math.min(10, Math.max(0, canvasW(e))); trail.push({x:w,y:gap*gap}); render(); });
cv.addEventListener('pointermove', e=>{
  if(!ballDrag) return;
  w = Math.min(10, Math.max(0, canvasW(e)));
  trail.push({x:w, y:gap*gap}); render();
});
cv.addEventListener('pointerup', ()=> ballDrag=false);

render();
</script>
</body>
</html>
