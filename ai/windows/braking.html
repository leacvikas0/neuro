<!DOCTYPE html>
<html>
<head>
<title>How the Machine Brakes</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #fafafa; }
  .container { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: auto;}
  .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .row { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;}
  .val { font-weight: bold; font-family: monospace; }
  .btn { display: block; width: 100%; padding: 15px; margin-top: 10px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;}
  .btn:hover { background: #005f9e; }
  .highlight { color: #d9534f; }
</style>
</head>
<body>
  <h2>Does it ever stop?</h2>
  <div class="container">
    <div class="panel">
      <div class="row"><span>Truth Goal:</span> <span class="val">80</span></div>
      <div class="row"><span>Input (x):</span> <span class="val">2</span></div>
      <div class="row"><span>Learning Rate:</span> <span class="val">0.01</span></div>
    </div>
    
    <div class="panel">
      <div class="row"><span>Dial (y):</span> <span class="val highlight" id="val-y">5.000</span></div>
      <div class="row"><span>Output (x * y):</span> <span class="val" id="val-out">10.000</span></div>
      <div class="row" style="background:#fff3f3"><span>Loss (Truth - Output):</span> <span class="val" id="val-loss">70.000</span></div>
      <div class="row" style="background:#eef7ff"><span>Nudge (Input * Loss * Rate):</span> <span class="val highlight" id="val-nudge">1.400</span></div>
    </div>
    
    <button class="btn" onclick="step()">Take 1 Step: y = y + Nudge</button>
  </div>

<script>
  let y = 5;
  let truth = 80;
  let x = 2;
  let rate = 0.01;

  function step() {
    let out = x * y;
    let loss = truth - out;
    let nudge = x * loss * rate;
    
    // Apply the nudge!
    y = y + nudge;
    
    // Recalculate for display
    out = x * y;
    loss = truth - out;
    nudge = x * loss * rate;
    
    document.getElementById('val-y').innerText = y.toFixed(3);
    document.getElementById('val-out').innerText = out.toFixed(3);
    document.getElementById('val-loss').innerText = loss.toFixed(3);
    document.getElementById('val-nudge').innerText = nudge.toFixed(3);
  }
</script>
</body>
</html>
