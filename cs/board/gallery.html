<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Board</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0b0c;color:#f2f2f2;font:500 15px/1.3 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
.s{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none}
.s.on{opacity:1}
.s img{width:100%;height:100%;object-fit:contain;transform:scale(1.03);transition:transform 6s ease-out}
.s.on img{transform:scale(1)}
.cap{position:fixed;left:28px;bottom:30px;display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-radius:14px;background:rgba(12,12,13,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08)}
.cap b{font-size:26px;letter-spacing:-.02em;font-weight:650}.cap span{opacity:.7;font-size:16px}
.dots{position:fixed;right:28px;bottom:38px;display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.3);transition:.3s;cursor:pointer}
.dots i.on{width:26px;background:#fff}
.hint{position:fixed;top:18px;right:22px;opacity:.45;font-size:12px;letter-spacing:.04em}
</style>
<div id=stage></div><div class=cap><b id=t></b><span id=u></span></div><div class=dots id=d></div><div class=hint>&larr; &rarr; &middot; A D &middot; W S</div>
<script>
fetch('slides.json',{cache:'no-store'}).then(r=>r.json()).then(S=>{
const st=document.getElementById('stage'),d=document.getElementById('d'),t=document.getElementById('t'),u=document.getElementById('u');
S.forEach((s,i)=>{const e=document.createElement('div');e.className='s';e.innerHTML='<img src="'+s.img+'">';st.appendChild(e);
const p=document.createElement('i');p.onclick=()=>go(i);d.appendChild(p)});
let n=-1;const go=i=>{i=(i+S.length)%S.length;n=i;location.hash=i+1;
[...st.children].forEach((e,j)=>e.classList.toggle('on',j===i));[...d.children].forEach((e,j)=>e.classList.toggle('on',j===i));
t.textContent=S[i].title;u.textContent=S[i].sub||''};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(['arrowright','d','s','arrowdown',' '].includes(k)){go(n+1);e.preventDefault()}
else if(['arrowleft','a','w','arrowup'].includes(k)){go(n-1);e.preventDefault()}});
let x;addEventListener('touchstart',e=>x=e.touches[0].clientX);addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>40)go(n+(dx<0?1:-1))});
st.onclick=e=>go(n+(e.clientX>innerWidth/2?1:-1));
go((parseInt(location.hash.slice(1))||1)-1);focus();
});
</script>
