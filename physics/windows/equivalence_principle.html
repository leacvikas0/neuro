<!DOCTYPE html>
<html>
<head>
    <title>The Equivalence Principle</title>
    <style>
        body { margin: 0; padding: 0; background: #0f172a; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { display: flex; gap: 40px; margin-top: 20px; }
        .box-wrapper { position: relative; width: 250px; height: 350px; border: 2px solid #334155; border-radius: 12px; background: #1e293b; overflow: hidden; }
        .floor { position: absolute; bottom: 0; width: 100%; height: 20px; background: #475569; }
        .person { position: absolute; bottom: 20px; left: 100px; width: 20px; height: 50px; background: #38bdf8; border-radius: 10px; }
        .pen { position: absolute; width: 6px; height: 20px; background: #facc15; border-radius: 3px; }
        
        /* Box 1: Earth (Stationary, pen pulled down) */
        #box1 .pen { left: 130px; top: 150px; }
        .label { text-align: center; margin-top: 10px; font-weight: bold; color: #94a3b8; }
        
        /* Box 2: Rocket (Moving up, floor meets pen) */
        #box2-container { position: relative; height: 100%; width: 100%; }
        #box2 .pen { left: 130px; top: 150px; }
        .thrust { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); width: 40px; height: 30px; background: linear-gradient(to bottom, #ef4444, transparent); border-radius: 50%; opacity: 0; }

        .controls { margin-top: 40px; display: flex; gap: 20px; }
        button { padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; background: #3b82f6; color: white; transition: 0.2s; }
        button:hover { background: #2563eb; }
        
        #earth-text { position: absolute; top: 20px; width: 100%; text-align: center; color: #94a3b8; font-size: 14px; }
        #rocket-text { position: absolute; top: 20px; width: 100%; text-align: center; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Inside the Windowless Box</h2>
    <div class="container">
        <!-- Box 1: Earth -->
        <div>
            <div class="box-wrapper" id="box1">
                <div id="earth-text">Stationary on Earth<br>Gravity pulls pen DOWN</div>
                <div class="person"></div>
                <div class="pen" id="pen1"></div>
                <div class="floor"></div>
            </div>
            <div class="label">Box 1</div>
        </div>

        <!-- Box 2: Rocket -->
        <div>
            <div class="box-wrapper" id="box2">
                <div id="rocket-text">Deep Space<br>Rocket pushes floor UP</div>
                <div id="box2-container">
                    <div class="person" id="person2"></div>
                    <div class="pen" id="pen2"></div>
                    <div class="floor" id="floor2"></div>
                </div>
            </div>
            <div class="label">Box 2</div>
            <div class="thrust" id="thrust"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="dropPen()">Drop Pen</button>
        <button onclick="reset()" style="background: #475569;">Reset</button>
    </div>

    <script>
        let isAnimating = false;

        function dropPen() {
            if (isAnimating) return;
            isAnimating = true;

            // Box 1 (Earth): Floor stays still, pen drops due to gravity
            const pen1 = document.getElementById('pen1');
            let v1 = 0;
            let y1 = 150;
            
            // Box 2 (Rocket): Pen stays still in space, rocket (floor & person) accelerates up to meet it
            const container2 = document.getElementById('box2-container');
            const thrust = document.getElementById('thrust');
            let v2 = 0;
            let y2 = 0; // container offset
            
            thrust.style.opacity = 1;

            const g = 0.5; // acceleration

            function animate() {
                // Earth math
                v1 += g;
                y1 += v1;
                
                // Rocket math
                v2 += g;
                y2 += v2;

                if (y1 >= 280) { // Hit the floor (350 height - 20 floor - 50 person height)
                    pen1.style.top = '280px';
                    // The pen in the rocket hits the floor at the exact same moment relative to the box
                    container2.style.transform = `translateY(-${130}px)`; // Floor met the pen
                    isAnimating = false;
                    thrust.style.opacity = 0;
                    return;
                }

                pen1.style.top = y1 + 'px';
                container2.style.transform = `translateY(-${y2}px)`;

                requestAnimationFrame(animate);
            }
            animate();
        }

        function reset() {
            isAnimating = false;
            document.getElementById('pen1').style.top = '150px';
            document.getElementById('box2-container').style.transform = 'translateY(0px)';
            document.getElementById('thrust').style.opacity = 0;
        }
    </script>
</body>
</html>
