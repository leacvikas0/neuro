<!DOCTYPE html>
<html>
<head>
    <title>The Stack of Cards</title>
    <style>
        body { 
            background: #111; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: monospace; 
        }
        .container { 
            position: relative; 
            width: 400px; 
            height: 400px; 
            border: 2px solid #444; 
            margin-bottom: 40px; 
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: #1a1a1a;
            padding-bottom: 50px;
        }
        
        #deck {
            position: relative;
            width: 150px;
            height: 150px;
        }

        /* We will generate 50 slices (cards) via JS */
        .card {
            position: absolute;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00ffcc;
            border-bottom: 1px solid #00aaaa; /* just to show they are distinct */
        }

        .slider-container { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 15px; 
            font-size: 22px; 
        }
        
        input[type=range] { 
            width: 400px; 
            cursor: pointer; 
            accent-color: #00ffcc;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div id="deck"></div>
    </div>
    
    <div class="slider-container">
        <label>Push the side of the deck</label>
        <input type="range" id="push" min="-1.5" max="1.5" step="0.01" value="0" oninput="updateCards()">
    </div>

    <script>
        const deck = document.getElementById('deck');
        const numCards = 50;
        const cardHeight = 3; // 50 * 3 = 150px total height

        // Create the cards
        for (let i = 0; i < numCards; i++) {
            let card = document.createElement('div');
            card.className = 'card';
            // Position them from bottom to top
            card.style.bottom = `${i * cardHeight}px`;
            deck.appendChild(card);
        }

        function updateCards() {
            let pushForce = document.getElementById('push').value;
            let cards = document.getElementsByClassName('card');
            
            for (let i = 0; i < numCards; i++) {
                // The higher the card, the further it slides
                let slideAmount = i * pushForce;
                cards[i].style.transform = `translateX(${slideAmount}px)`;
            }
        }
    </script>
</body>
</html>
