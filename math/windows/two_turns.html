<!DOCTYPE html>
<html>
<head>
    <title>Two Half-Flips</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        svg { overflow: visible; }
        .axis { stroke: #444; stroke-width: 2; }
        .tick { stroke: #444; stroke-width: 2; }
        .label { fill: #888; font-size: 16px; text-anchor: middle; font-family: monospace; }
        
        #arrow { 
            stroke: #00ffcc; 
            stroke-width: 6; 
            fill: none; 
            stroke-linecap: round; stroke-linejoin: round;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-origin: 0 0; 
        }
        
        .button { background: #222; border: 1px solid #555; color: #fff; padding: 16px 32px; font-size: 20px; border-radius: 8px; cursor: pointer; margin-top: 40px; transition: 0.2s; font-family: monospace;}
        .button:hover { background: #333; border-color: #00ffcc; color: #00ffcc; }
        
        .equation { font-size: 24px; font-family: monospace; margin-top: 30px; color: #aaa; text-align: center; line-height: 1.5;}
        .highlight { color: #00ffcc; font-weight: bold; }
        .history { display: flex; gap: 10px; margin-top: 20px; height: 40px; align-items: center;}
        .step { background: #333; padding: 8px 16px; border-radius: 4px; color: #fff; font-family: monospace;}
    </style>
</head>
<body>
    <svg width="400" height="400" viewBox="-200 -200 400 400">
        <!-- The Field (Tape is the X axis) -->
        <rect x="-200" y="-200" width="400" height="400" fill="#1a1a1a" />
        
        <line class="axis" x1="-200" y1="0" x2="200" y2="0" stroke-dasharray="8,4" /> <!-- The Tape -->
        <line class="axis" x1="0" y1="-200" x2="0" y2="200" /> <!-- The New Dimension -->
        
        <script>
            for(let i=-3; i<=3; i++) {
                if(i !== 0) {
                    document.write(`<line class="tick" x1="${i*50}" y1="-5" x2="${i*50}" y2="5" />`);
                    document.write(`<text class="label" x="${i*50}" y="25">${i}</text>`);
                }
            }
        </script>
        
        <circle cx="0" cy="0" r="4" fill="#fff" />

        <g id="arrowGroup">
            <path id="arrow" d="M 0 0 L 100 0 L 80 -15 M 100 0 L 80 15" />
        </g>
    </svg>

    <div class="equation" id="eq">Start facing <span class="highlight">1</span></div>
    
    <div class="history" id="hist">
        <!-- Steps will appear here -->
    </div>

    <button class="button" id="btn" onclick="takeStep()">Action: 90° Turn (Half-Flip)</button>

    <script>
        let clicks = 0;
        
        function takeStep() {
            clicks++;
            let deg = clicks * -90; // Rotate counter-clockwise visually
            
            document.getElementById('arrow').style.transform = `rotate(${deg}deg)`;
            
            const hist = document.getElementById('hist');
            
            if (clicks === 1) {
                document.getElementById('eq').innerHTML = `Off the tape!`;
                hist.innerHTML += `<div class="step">1st 90° turn</div>`;
            } else if (clicks === 2) {
                document.getElementById('eq').innerHTML = `Back on the tape. Facing <span class="highlight">-1</span>`;
                hist.innerHTML += `<div class="step">+ 2nd 90° turn</div>`;
                document.getElementById('btn').style.display = 'none'; // Stop here to make the point
            }
        }
    </script>
</body>
</html>
