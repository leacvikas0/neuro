<!DOCTYPE html>
<html>
<head>
    <title>The Rubber Sheet</title>
    <style>
        body { 
            background: #111; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: monospace; 
            overflow: hidden;
        }
        .container { 
            position: relative; 
            width: 500px; 
            height: 500px; 
            border: 2px solid #444; 
            margin-bottom: 40px; 
            overflow: hidden;
            background: #1a1a1a;
        }
        
        /* The entire universe that we will warp */
        #universe {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            transform-origin: 50% 50%; /* Center of the screen is the origin */
        }

        .grid { 
            position: absolute; 
            top: -100%; 
            left: -100%; 
            width: 300%; 
            height: 300%;
            background-image: 
                linear-gradient(#333 2px, transparent 2px),
                linear-gradient(90deg, #333 2px, transparent 2px);
            background-size: 50px 50px;
            background-position: center center;
        }
        
        .axis-x { 
            position: absolute; 
            top: 50%; 
            left: -100%; 
            width: 300%; 
            height: 4px; 
            background: #ff3366; 
            margin-top: -2px;
        }
        
        .axis-y { 
            position: absolute; 
            top: -100%; 
            left: 50%; 
            width: 4px; 
            height: 300%; 
            background: #00ffcc; 
            margin-left: -2px;
        }
        
        .shape {
            position: absolute; 
            bottom: 50%; 
            left: 50%; 
            width: 100px; /* 2 grid squares wide */
            height: 100px; /* 2 grid squares tall */
            background: rgba(255, 255, 255, 0.15); 
            border: 4px solid white;
            box-sizing: border-box;
        }

        .slider-container { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 15px; 
            font-size: 22px; 
        }
        
        input[type=range] { 
            width: 400px; 
            cursor: pointer; 
            accent-color: #00ffcc;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div id="universe">
            <div class="grid"></div>
            <div class="axis-x"></div>
            <div class="axis-y"></div>
            <div class="shape"></div>
        </div>
    </div>
    
    <div class="slider-container">
        <label>Pull the Top of Space to the Right</label>
        <input type="range" id="pull" min="-1.5" max="1.5" step="0.01" value="0" oninput="updateSpace()">
    </div>

    <script>
        function updateSpace() {
            let shearForce = document.getElementById('pull').value;
            // A shear matrix in CSS: matrix(1, 0, shear_x, 1, 0, 0)
            // It leaves the X axis alone, but tilts the Y axis.
            document.getElementById('universe').style.transform = `matrix(1, 0, ${-shearForce}, 1, 0, 0)`;
        }
    </script>
</body>
</html>
